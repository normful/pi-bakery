name: PR Checks

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "26"
          cache: npm

      - name: Install dependencies
        # Temporary: repo sets loglevel=silent, which hides the real error
        # when `npm ci` fails. Verbose until the install failure is fixed.
        run: npm ci --loglevel=verbose

      - name: Typecheck
        run: npm run typecheck

      - name: Lint (vp check)
        run: npm run lint

      - name: Test (vp test)
        run: npm test
        env:
          # Opt in to the pi-parrot Tier 2 PTY test (real TUI suspend/resume
          # via node-pty; skipped without this variable).
          PI_PARROT_PTY: "1"
